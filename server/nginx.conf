user  www-data;
worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_max_body_size 5000M;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name intechstudio;
        root /var/www/html/public;
        index index.php index.html;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;

            client_max_body_size 5000M;

            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Cache static assets - Images
        # Different cache strategy for CMS images (in /storage/) vs static assets
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
            # For CMS images in /storage/, use shorter cache with must-revalidate
            if ($uri ~* "^/storage/") {
                expires 7d;
                add_header Cache-Control "public, max-age=604800, must-revalidate";
                access_log off;
                break;
            }
            # For static assets, use long cache with immutable
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Cache static assets - CSS
        location ~* \.css$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Cache static assets - JavaScript
        location ~* \.js$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Cache static assets - Fonts
        location ~* \.(woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Cache HTML files with shorter duration
        location ~* \.html$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }

        location ~ /\. {
            deny all;
        }
    }
}
